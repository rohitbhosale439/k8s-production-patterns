apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70     # relative to the pod's CPU *request*
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60          # at most double every minute
    scaleDown:
      stabilizationWindowSeconds: 300  # wait 5 min of low load before removing pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60          # remove at most one pod per minute
